# Builds CosmicAbilities-x.y.z.jar on GitHub's servers every time you push.
# Get it from the repo's "Actions" tab -> latest run -> "Artifacts" -> CosmicAbilities,
# or from the "builds" branch, which always holds the latest jar + resource pack.
name: Build plugin

on:
  push:
    branches-ignore: [builds]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Bundle resource pack
        run: |
          mkdir -p out
          cp build/libs/*.jar out/
          cp CosmicAbilities-ResourcePack.zip out/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: CosmicAbilities
          path: out/

      - name: Publish to the "builds" branch
        run: |
          cp -r out /tmp/out
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan builds-new
          git rm -rf -q .
          git clean -fdxq
          cp /tmp/out/* .
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -f origin HEAD:builds
