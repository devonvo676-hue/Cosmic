# =========================================================
#  Cosmic Abilities 2.6 - configuration (Paper 1.21.11)
# =========================================================

# Players can always cast with /ability 1 and /ability 2, and pick their own keys in /keybinds
# (defaults: slot 1 = Sneak + F, slot 2 = Sneak + left-click with an empty hand).

abilities:
  damage-multiplier: 0.8     # scales ALL ability damage
  cooldown-multiplier: 1.0   # scales ALL cooldowns
  minimum-cooldown: 4.0
  hit-players: true          # PvP / region plugins still apply on top of this
  hit-passive-mobs: false
  # Anti one-shot: a player can only take this much ability damage (before armour) from abilities in any
  # combo-window-seconds window. Stops stacking several abilities into an instant kill.
  combo-damage-cap: 14
  combo-window-seconds: 4
  bonus-mechanics: true      # each ability's signature extra (Event Horizon, Quasar, ...). false = simpler abilities
  # Abilities deal magic damage: armor points don't block it, but Protection enchants still do. Tuned so a full
  # Prot IV diamond player takes about 2-3 hearts from a big hit (vs ~0.5 from a Sharp V netherite sword swing).
  # false = normal damage that armor reduces (abilities become very weak against armored players).
  armor-piercing: true

# Per-ability balance. cooldown = seconds before upgrade/global multiplier; damage-multiplier scales only that ability.
# Also editable in game with /cconfig.
ability-settings:
  singularity: {cooldown: 18, damage-multiplier: 1.0}
  supernova: {cooldown: 15, damage-multiplier: 1.0}
  meteor: {cooldown: 10, damage-multiplier: 1.0}
  solar: {cooldown: 20, damage-multiplier: 1.0}
  cryostasis: {cooldown: 18, damage-multiplier: 1.0}
  voidwalker: {cooldown: 9, damage-multiplier: 1.0}
  pulsar: {cooldown: 12, damage-multiplier: 1.0}
  nebula: {cooldown: 22, damage-multiplier: 1.0}
  orbital: {cooldown: 18, damage-multiplier: 1.0}
  celestial: {cooldown: 24, damage-multiplier: 1.0}
  paradox: {cooldown: 20, damage-multiplier: 1.0}
  entropy: {cooldown: 22, damage-multiplier: 1.0}
  magnetosphere: {cooldown: 40, damage-multiplier: 1.0}
  umbra: {cooldown: 20, damage-multiplier: 1.0}
  dragon_awakening: {cooldown: 50, damage-multiplier: 1.0}
  riftbreaker: {cooldown: 35, damage-multiplier: 1.0}
  starpiercer: {cooldown: 30, damage-multiplier: 1.0}
  shatterfall: {cooldown: 40, damage-multiplier: 1.0}
  serpents_wrath: {cooldown: 40, damage-multiplier: 1.0}
  apocalypse: {cooldown: 50, damage-multiplier: 1.0}

# Short combat buff given every time an ability is cast (edit in game with /cconfig).
# Format: effect:level:seconds  (strength:1:6 = Strength I for 6 seconds). Use [] for none.
cast-buffs:
  singularity: ["strength:1:6"]
  supernova: ["strength:1:5", "resistance:1:3"]
  meteor: ["speed:2:5"]
  solar: ["resistance:1:6", "fire_resistance:1:8"]
  cryostasis: ["resistance:1:5"]
  voidwalker: ["speed:2:4"]
  pulsar: ["strength:1:5"]
  nebula: ["speed:1:6", "regeneration:1:6"]
  orbital: ["resistance:1:6"]
  celestial: ["regeneration:2:5", "absorption:1:10"]
  paradox: ["resistance:1:4"]
  entropy: ["strength:1:5"]
  magnetosphere: ["resistance:1:8"]
  umbra: ["speed:2:5"]
  dragon_awakening: ["resistance:1:6", "speed:1:6"]
  riftbreaker: ["resistance:1:4"]
  starpiercer: ["strength:1:5"]
  shatterfall: ["resistance:1:4"]
  serpents_wrath: ["speed:1:6"]
  apocalypse: ["absorption:2:8"]

entropy:
  scramble-seconds: 5      # how long a victim's hotbar stays scrambled before it reverts

magnetosphere:
  radius: 6
  duration-seconds: 15
  hide-from-caster: false  # true = the caster can't see their own forcefield (everyone else still can)
  # Whoever is inside when it goes up can't leave until it drops; nobody outside can get in (walking, pearls, teleports).
  caster-can-pass: true    # the caster can walk in and out of their own dome
  repulsor-shock-damage: 3 # with the Repulsor bonus, enemies who hit the wall take this much damage

# Each ability can be upgraded ONCE. The upgrade shortens its cooldown.
upgrades:
  require-token: true      # upgrading uses a crafted Upgrade Token (right-click it, pick the ability). false = old fragment cost
  cooldown-reduction: 0.3  # 0.3 = 30% shorter cooldown
  cost:
    fragments: 16          # of the fragment that matches the ability
    astral-fragments: 2
  cutscene: true           # play the upgrade cutscene
  cutscene-camera: true    # move the player's camera around them during it

# Slot 1 = the ability a player joined with: never lost.
# Slot 2 = a gained ability (boss orbs, kills): dropped when the player is killed.
ability-drops:
  from-bosses: true        # every boss drops a random ability orb
  killer-only-seconds: 60  # only the killer can pick up a dropped ability for this long
  lose-on-any-death: false # true = also drop it when dying to mobs/falling/etc.
  dragon-chance: 1.0           # chance the top damage dealer on the Ender Dragon gets Dragon's Awakening
  # bosses: the top damage dealer always gets an ability orb (see bosses.<boss>.ability-chance)

reroll:
  craftable: true          # false = can't be crafted (still sold in the AFK shop / given by admins)

# Craftable cosmic items. Edit them in game: /adminpanel -> Recipes (pick up an item, click a grid slot).
# shape = 3 rows of 3 characters (space = empty). ingredients = a Minecraft item name, or cosmic:<fragment>
# (void_shard, solar_core, frozen_stardust, nebula_essence, astral_fragment).
recipes:
  reroll:
    enabled: true
    shape: ["DED", "ETE", "DED"]
    ingredients: {D: DIAMOND, E: ENDER_EYE, T: TOTEM_OF_UNDYING}
  cosmic_pickaxe:
    enabled: true
    shape: ["BAB", "ANA", "BAB"]
    ingredients: {B: DIAMOND_BLOCK, A: "cosmic:cosmic_shard", N: NETHERITE_PICKAXE}
  cosmic_axe:
    enabled: true
    shape: ["BAB", "ANA", "BAB"]
    ingredients: {B: DIAMOND_BLOCK, A: "cosmic:cosmic_shard", N: NETHERITE_AXE}
  cosmic_shovel:
    enabled: true
    shape: ["BAB", "ANA", "BAB"]
    ingredients: {B: DIAMOND_BLOCK, A: "cosmic:cosmic_shard", N: NETHERITE_SHOVEL}
  cosmic_shard:            # makes `amount` shards
    enabled: true
    amount: 2
    shape: ["GAG", "AEA", "GAG"]
    ingredients: {G: GLOWSTONE_DUST, A: AMETHYST_SHARD, E: ENDER_PEARL}
  upgrade_token:
    enabled: true
    shape: ["SDS", "DND", "SDS"]
    ingredients: {S: "cosmic:cosmic_shard", D: DIAMOND, N: NETHER_STAR}

# Cosmic Pickaxe (3x3 mining) and Cosmic Axe (whole trees). Shift + right-click toggles them.
cosmic-tools:
  efficiency: 5
  unbreaking: 3
  max-tree-blocks: 200
  break-leaves: false      # true = the axe also clears the leaves near the trunk

# The cosmic wheel spins for every new player's first ability (and for every Cosmic Reroll).
first-join:
  spin-delay-ticks: 80     # wait this long after joining (lets the resource pack load first)

death:
  lose-upgrade: true       # dying also removes the upgrade from your abilities
  pvp-only: false          # true = only when killed by a player

effects:
  damage-numbers: true     # floating damage numbers on hit

hud:
  enabled: true
  use-icons: true          # false = plain text names (no resource pack needed)

# The plugin sends this pack on join, stacked on top of your server's own pack.
resource-pack:
  url: ""
  sha1: ""
  required: false
  prompt: "Cosmic Abilities needs this pack for its icons, models and sounds."

# ---------------------------------------------------------------- bosses
# Admins start boss fights with /bossfight (or the admin panel).
bossfight:
  countdown-seconds: 10    # default countdown shown to the whole server (0, 10, 30 or 60)
  gather-radius: 40        # players must be this close to the spot to count toward "players needed"
  wait-timeout-seconds: 300  # cancel the fight if not enough players arrive in time

bosses:
  custom-models: true      # animated 3D cosmic boss models (needs the resource pack)
  cutscene: true           # camera cutscene for everyone nearby when a boss spawns (it rises out of the ground)
  cutscene-seconds: 6
  cutscene-radius: 64
  min-players-to-damage: 3 # boss is shielded unless this many players are within fight-radius (1 = off)
  fight-radius: 32
  bossbar-range: 48
  # global knobs (multiply every boss's own values below). Everything is also in /adminpanel -> Boss Settings.
  health-multiplier: 1.0
  damage-multiplier: 1.0
  size-multiplier: 1.0
  drops:
    min: 4
    max: 7
    top-damage-bonus: 2
    min-damage-share: 0.05
    bonus-astral-chance: 0.3
  # Per boss: health, damage (melee), special-damage, special-attack-interval (s), special-radius, speed, size (scale),
  # armor, armor-toughness, knockback-resistance, follow-range, ability-chance (chance the TOP DAMAGE player gets
  # this boss's own ability instead of a random one), drops.min / drops.max. Max health is capped at 1024 by spigot.yml.
  void_emperor:
    health: 650
    damage: 12
    special-damage: 6
    special-attack-interval: 7
    special-radius: 14
    speed: 0.3
    size: 2.2
    armor: 14
    armor-toughness: 4
    knockback-resistance: 0.8
    ability-chance: 1.0
  solar_titan:
    health: 850
    damage: 15
    special-damage: 9
    special-attack-interval: 8
    special-radius: 12
    speed: 0.25
    size: 2.8
    armor: 18
    armor-toughness: 6
    knockback-resistance: 1.0
    ability-chance: 1.0
  frost_leviathan:
    health: 700
    damage: 11
    special-damage: 6
    special-attack-interval: 6
    special-radius: 14
    speed: 0.3
    size: 2.6
    armor: 14
    armor-toughness: 4
    knockback-resistance: 0.8
    ability-chance: 1.0
  nebula_serpent:
    health: 650
    damage: 10
    special-damage: 5
    special-attack-interval: 6
    special-radius: 14
    heal-percent: 5
    speed: 0.33
    size: 2.2
    armor: 12
    armor-toughness: 4
    knockback-resistance: 0.7
    ability-chance: 1.0
  cosmic_destroyer:
    health: 1000
    damage: 17
    special-damage: 11
    special-attack-interval: 7
    special-radius: 10
    speed: 0.3
    size: 1.9
    armor: 20
    armor-toughness: 8
    knockback-resistance: 1.0
    ability-chance: 1.0

# ---------------------------------------------------------------- staff tools
ban-pistol:
  range: 64
  bullet-speed: 3.5        # blocks per tick
  volume: 4.0              # >1 makes it audible further away
  vanilla-sound-layer: true
  reason: "Shot by the Ban Pistol"
  duration-minutes: 0      # 0 = permanent. /unban <player> lifts it.
  exempt-staff: true
  broadcast: true
  cooldown-ms: 300          # time between shots
  magazine-size: 7          # shots before the magazine drops out and you reload (Q reloads early)
  magazine-despawn-seconds: 8
  animal-damage: 8          # mobs/animals hit by the bullet take this much damage and bleed
  wound-seconds: 12         # how long the bullet hole stays on them
  recoil-degrees: 3.5      # how far your aim kicks up per shot (0 = no camera kick)

# Death messages name the ability: "Steve was killed by Alex's Pulsar"
death-messages:
  name-ability: true

# Dropped cosmic items (Cosmic Pickaxe/Axe, Ban Pistol, Cosmic Reroll) glow white so they're easy to spot
dropped-item-glow: true

tags:
  use-icons: false         # false = "[OWNER] Name" text beside the username

announce:
  header: "ANNOUNCEMENT"
  seconds: 5

afk:
  minutes-per-token: 30
  invulnerable: true       # nothing can hurt or move AFK players; only pressing a movement key ends AFK
  combat-cooldown-seconds: 15
  broadcast: true

messages:
  prefix: "<dark_gray>[<gradient:#9b5de5:#00bbf9>Cosmic</gradient><dark_gray>] "

# Only server operators are admins: the admin panel and every admin tool/command are hidden from everyone else.
admin:
  op-only: true

# Cosmic cash and coinflips (/cf, /balance, /pay; admins: /eco give|take|set)
economy:
  starting-cash: 10000
  kill-reward: 1000        # cash for every player kill (also in /adminpanel)
  daily-reward: 0          # optional cash for the first login each day (0 = off)
  timezone: America/Denver # when the "day" rolls over
coinflip:
  min-bet: 1000
  max-bet: 0               # 0 = no maximum
  max-per-player: 3        # open coinflips per player
  tax: 0.0                 # 0.05 = the house keeps 5% of each pot
  announce-min: 50000      # pots this big are announced to everyone

# Game chat -> Discord. In Discord: channel settings -> Integrations -> Webhooks -> New Webhook -> Copy Webhook URL,
# then in game: /discordbridge set <url>. Only public chat is sent (never /msg or other commands).
discord:
  enabled: true
  webhook-url: ""
  join-leave: true
  deaths: true
  server-name: "Minecraft"

# Store ranks (sell them on Tebex: package command "cosmicrank give {username} supernova").
# Each rank shows [RANK] beside the name and gets a bigger ender chest (rows of 9, max 6).
ranks:
  custom-ender-chest: true
  none: {echest-rows: 3}
  starlight: {echest-rows: 4}
  cosmos: {echest-rows: 5}
  supernova: {echest-rows: 6}

# The COSMIC panel on the right of the screen (players toggle it with /sidebar)
sidebar:
  enabled: true

# /ah auction house (uses the same cash as coinflips)
auction:
  expire-hours: 48
  max-listings: 10
  min-price: 1
  tax: 0.0                 # 0.05 = 5% of each sale is removed from the economy
  team-bank-pays: true     # purchases by team members come out of the team bank (lowers their season score)
  team-bank-leader-only: true  # only the team leader can spend the bank (others pay with their own cash)
  sales-to-team-bank: true # money from selling goes into the seller's team bank
  announce: true

# ---------------------------------------------------------------- teams & seasons (Money SMP)
teams:
  max-size: 4
season:
  days: 14                 # the richest team bank when it ends wins
  auto-end: true
  reward: random-rare      # random-rare = a random boss/dragon ability, or an ability id like dragon_wrath

# ---------------------------------------------------------------- daily events (/adminpanel -> Daily Events)
events:
  supply-rain-minutes: 5

supply-drops:
  despawn-minutes: 10      # the chest vanishes after this long (0 = never)
  random-radius: 800       # "spawn" picks a random spot this far (max) from world spawn
  random-min-radius: 100
  item-chance: 0.7         # each item in the loot chest (/adminpanel -> Supply Drops -> Edit the loot) has this chance
  # used only while the loot chest is empty:
  # ITEM:min-max:chance   or   cosmic:<cosmic_shard|upgrade_token|afk_token|reroll>:min-max:chance
  loot:
    - "DIAMOND:3-8:0.9"
    - "NETHERITE_INGOT:1-2:0.35"
    - "GOLDEN_APPLE:2-5:0.8"
    - "ENCHANTED_GOLDEN_APPLE:1:0.1"
    - "ENDER_PEARL:4-12:0.7"
    - "EXPERIENCE_BOTTLE:16-32:0.6"
    - "TOTEM_OF_UNDYING:1:0.15"
    - "cosmic:cosmic_shard:4-12:0.8"
    - "cosmic:upgrade_token:1:0.15"
    - "cosmic:reroll:1:0.08"

rpg:
  explosion-power: 8       # TNT is 4
  crater-radius: 8
  break-blocks: true
  fire: true
  speed: 2.2
  cooldown-seconds: 1.5

tablist:
  enabled: true
  header-line: "<gray>Money SMP with cosmic abilities"
  footer-line: "<dark_gray>/team  /ah  /afk  /abilities"

# ---------------------------------------------------------------- admin-only "cocaine" (/adminpanel -> Give Items)
cocaine:
  duration-seconds: 30
  size: 0.4                # +40% size while it lasts
  strength: 3              # Strength level
  consume: false           # true = one is used up per sniff
  grab-cooldown-seconds: 3
  shake-seconds: 1.6
  shake-damage: 1          # per shake hit (every 8 ticks)
  slam-damage: 14          # 7 hearts
  slam-depth: 4            # blocks they're driven into the ground
  break-blocks: true
