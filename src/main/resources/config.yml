# =========================================================
#  Cosmic Abilities 2.0 - configuration (Paper 1.21.11)
# =========================================================

# Players can always cast with /ability 1 and /ability 2, and pick their own keys in /keybinds
# (defaults: slot 1 = Sneak + F, slot 2 = Sneak + left-click with an empty hand).

abilities:
  damage-multiplier: 1.0     # scales ALL ability damage
  cooldown-multiplier: 1.0   # scales ALL cooldowns
  minimum-cooldown: 4.0
  hit-players: true          # PvP / region plugins still apply on top of this
  hit-passive-mobs: false
  bonus-mechanics: true      # each ability's signature extra (Event Horizon, Quasar, ...). false = simpler abilities

# Per-ability balance. cooldown = seconds before upgrade/global multiplier; damage-multiplier scales only that ability.
# Also editable in game with /cconfig.
ability-settings:
  singularity: {cooldown: 18, damage-multiplier: 1.0}
  supernova: {cooldown: 15, damage-multiplier: 1.0}
  meteor: {cooldown: 10, damage-multiplier: 1.0}
  solar: {cooldown: 20, damage-multiplier: 1.0}
  cryostasis: {cooldown: 18, damage-multiplier: 1.0}
  voidwalker: {cooldown: 9, damage-multiplier: 1.0}
  pulsar: {cooldown: 12, damage-multiplier: 1.0}
  nebula: {cooldown: 22, damage-multiplier: 1.0}
  orbital: {cooldown: 18, damage-multiplier: 1.0}
  celestial: {cooldown: 24, damage-multiplier: 1.0}
  paradox: {cooldown: 20, damage-multiplier: 1.0}
  entropy: {cooldown: 22, damage-multiplier: 1.0}
  magnetosphere: {cooldown: 40, damage-multiplier: 1.0}
  umbra: {cooldown: 20, damage-multiplier: 1.0}

# Short combat buff given every time an ability is cast (edit in game with /cconfig).
# Format: effect:level:seconds  (strength:1:6 = Strength I for 6 seconds). Use [] for none.
cast-buffs:
  singularity: ["strength:1:6"]
  supernova: ["strength:1:5", "resistance:1:3"]
  meteor: ["speed:2:5"]
  solar: ["resistance:1:6", "fire_resistance:1:8"]
  cryostasis: ["resistance:1:5"]
  voidwalker: ["speed:2:4"]
  pulsar: ["strength:1:5"]
  nebula: ["speed:1:6", "regeneration:1:6"]
  orbital: ["resistance:1:6"]
  celestial: ["regeneration:2:5", "absorption:1:10"]
  paradox: ["speed:1:6"]
  entropy: ["strength:1:5"]
  magnetosphere: ["resistance:1:8"]
  umbra: ["speed:2:5"]

entropy:
  scramble-seconds: 5      # how long a victim's hotbar stays scrambled before it reverts

magnetosphere:
  radius: 6
  duration-seconds: 15
  hide-from-caster: false  # true = the caster can't see their own forcefield (everyone else still can)

# Each ability can be upgraded ONCE. The upgrade shortens its cooldown.
upgrades:
  cooldown-reduction: 0.3  # 0.3 = 30% shorter cooldown
  cost:
    fragments: 16          # of the fragment that matches the ability
    astral-fragments: 2
  cutscene: true           # play the upgrade cutscene
  cutscene-camera: true    # move the player's camera around them during it

# Slot 1 = the ability a player joined with: never lost.
# Slot 2 = a gained ability (boss orbs, kills): dropped when the player is killed.
ability-drops:
  from-bosses: true        # every boss drops a random ability orb
  killer-only-seconds: 60  # only the killer can pick up a dropped ability for this long
  lose-on-any-death: false # true = also drop it when dying to mobs/falling/etc.

reroll:
  craftable: true          # Diamond corners, Eye of Ender sides, Totem of Undying centre

death:
  lose-upgrade: true       # dying also removes the upgrade from your abilities
  pvp-only: false          # true = only when killed by a player

effects:
  damage-numbers: true     # floating damage numbers on hit

hud:
  enabled: true
  use-icons: true          # false = plain text names (no resource pack needed)

# The plugin sends this pack on join, stacked on top of your server's own pack.
resource-pack:
  url: ""
  sha1: ""
  required: false
  prompt: "Cosmic Abilities needs this pack for its icons, models and sounds."

# ---------------------------------------------------------------- bosses
# Admins start boss fights with /bossfight (or the admin panel).
bossfight:
  countdown-seconds: 10    # default countdown shown to the whole server (0, 10, 30 or 60)
  gather-radius: 40        # players must be this close to the spot to count toward "players needed"
  wait-timeout-seconds: 300  # cancel the fight if not enough players arrive in time

bosses:
  min-players-to-damage: 3 # boss is shielded unless this many players are within fight-radius (1 = off)
  fight-radius: 32
  bossbar-range: 48
  special-attack-interval: 6
  drops:
    min: 4
    max: 7
    top-damage-bonus: 2
    min-damage-share: 0.05
    bonus-astral-chance: 0.3
  void_emperor:
    health: 500
    damage: 11
  solar_titan:
    health: 500
    damage: 9
  frost_leviathan:
    health: 500
    damage: 9
  nebula_serpent:
    health: 450
    damage: 8
  cosmic_destroyer:
    health: 900
    damage: 15

# ---------------------------------------------------------------- staff tools
ban-pistol:
  range: 64
  bullet-speed: 3.5        # blocks per tick
  volume: 4.0              # >1 makes it audible further away
  vanilla-sound-layer: true
  reason: "Shot by the Ban Pistol"
  duration-minutes: 0      # 0 = permanent. /unban <player> lifts it.
  exempt-staff: true
  broadcast: true
  cooldown-ms: 800

tags:
  use-icons: false         # false = "[OWNER] Name" text beside the username

announce:
  header: "ANNOUNCEMENT"
  seconds: 5

afk:
  minutes-per-token: 30
  invulnerable: true
  combat-cooldown-seconds: 15
  broadcast: true

messages:
  prefix: "<dark_gray>[<gradient:#9b5de5:#00bbf9>Cosmic</gradient><dark_gray>] "
