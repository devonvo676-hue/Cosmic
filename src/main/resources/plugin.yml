name: CosmicAbilities
version: '${version}'
main: com.cosmicabilities.CosmicAbilitiesPlugin
api-version: '1.21'
description: Cosmic Awakening - 14 cosmic abilities, boss fights, ability orbs, AFK tokens and staff tools.
authors: [Devon]

commands:
  cosmic:
    description: Cosmic Abilities main command
    usage: /cosmic help
    aliases: [ca, cosmicabilities]
  ability:
    description: Cast the ability in slot 1 or 2
    usage: /ability <1|2>
    permission: cosmicabilities.use
  abilities:
    description: See what every ability does
    usage: /abilities
  abilityholders:
    description: See which player has which ability
    usage: /abilityholders
    aliases: [holders]
  keybinds:
    description: Choose how you cast your abilities
    usage: /keybinds
    aliases: [binds, keybind]
  bossfight:
    description: Start a boss fight (admin panel)
    usage: /bossfight
    aliases: [bossfights]
    permission: cosmicabilities.admin
  creload:
    description: Instantly reload the Cosmic config (and AFK shop) into the game
    usage: /creload
    aliases: [cosmicreload]
    permission: cosmicabilities.admin
  cconfig:
    description: Edit the Cosmic config in game
    usage: /cconfig
    aliases: [cosmicconfig]
    permission: cosmicabilities.admin
  trust:
    description: Your abilities won't affect players you trust
    usage: /trust <player|list>
  untrust:
    description: Stop trusting a player
    usage: /untrust <player>
  adminpanel:
    description: Open the Cosmic admin panel
    usage: /adminpanel
    aliases: [cpanel]
    permission: cosmicabilities.admin
  unban:
    description: Unban a player (e.g. after the Ban Pistol)
    usage: /unban <player>
    aliases: [cunban]
    permission: cosmicabilities.admin
  announce:
    description: Show a message on every player's screen
    usage: /announce <message>  or  /announce <title> | <subtitle>
    aliases: [broadcastscreen]
    permission: cosmicabilities.admin
  tag:
    description: Wear the [ADMIN] or [OWNER] tag beside your name
    usage: /tag <admin|owner|off>
    aliases: [nametag]
    permission: cosmicabilities.admin
  cf:
    description: Coinflip other players for cash
    usage: /cf [create <amount>|cancel]
    aliases: [coinflip]
  balance:
    description: See your cash
    usage: /balance [player]
    aliases: [bal, money, cash]
  pay:
    description: Send cash to another player
    usage: /pay <player> <amount>
  eco:
    description: Give, take or set a player's cash
    usage: /eco <give|take|set> <player> <amount>
    permission: cosmicabilities.admin
  recipes:
    description: Everything you can craft and how
    usage: /recipes
    aliases: [crecipes]
  ah:
    description: Auction house - buy and sell items for cash
    usage: /ah [sell <price>|mine|collect]
    aliases: [auction, auctionhouse]
  sidebar:
    description: Toggle the COSMIC panel on the right of your screen
    usage: /sidebar [on|off]
    aliases: [board, scoreboard]
  cosmicrank:
    description: Give a rank box (Tebex) or set a player's rank
    usage: /cosmicrank <give|set> <player> <rank>
    permission: cosmicabilities.admin
  discordbridge:
    description: Link game chat to a Discord channel
    usage: /discordbridge set <webhook url>
    permission: cosmicabilities.admin
  afk:
    description: Go AFK and earn AFK tokens
    usage: /afk
  afkshop:
    description: Spend AFK tokens
    usage: /afkshop

permissions:
  cosmicabilities.use:
    description: Use your cosmic abilities and player commands
    default: true
  cosmicabilities.admin:
    description: Admin panel, ban pistol, ADMIN tag, /announce, /unban, AFK shop editing and /cosmic admin
    default: op
    children:
      cosmicabilities.use: true
