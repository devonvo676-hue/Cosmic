# =========================================================
#  AFK Shop - players earn 1 AFK token every 30 minutes of /afk
# =========================================================
# Every entry under "items" is something players can buy. Options:
#   price:     cost in AFK tokens (required)
#   slot:      0-44 position in the menu (optional, auto-placed if missing)
#   material:  any Minecraft item (DIAMOND, NETHERITE_SWORD, ...)
#   amount:    how many
#   name:      display name (MiniMessage colours, e.g. "<gold>Lucky Pick")
#   rename-given-item: true to also give the item that name
#   lore:      list of lore lines
#   enchantments: {sharpness: 5, unbreaking: 3}
#   cosmic:    a Cosmic fragment instead of a material: void_shard, solar_core, frozen_stardust, nebula_essence, astral_fragment
#   commands:  console commands to run on purchase, {player} = buyer (e.g. ranks, crates, money)
#   give-item: false to only run the commands
#   icon:      menu icon when the entry is commands-only
#   special:   reroll  -> sells a Cosmic Reroll
#
# In game, admins can also hold an item and type  /afkshop add <price> [slot]
# (saves the exact item with its name/enchants) and shift-right-click an entry to remove it.
# After editing this file: /afkshop reload

